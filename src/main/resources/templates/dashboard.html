<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Dashboard')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu('dashboard')}"></nav>

<main class="container">
    <p class="olho esq">Painel</p>
    <h1>Como estão os pets hoje</h1>
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <section class="grid-stats" aria-label="Resumo">
        <div class="stat">
            <div class="valor" th:text="${dados.quantidadePets()}">0</div>
            <div class="rotulo">🐾 Pets cadastrados</div>
        </div>
        <div class="stat">
            <div class="valor" th:text="${dados.proximasConsultas()}">0</div>
            <div class="rotulo">📅 Próximas consultas</div>
        </div>
        <div class="stat">
            <div class="valor" th:text="${dados.vacinasPendentes()}">0</div>
            <div class="rotulo">💉 Vacinas pendentes</div>
        </div>
        <div class="stat">
            <div class="valor" th:text="${dados.ultimaConsulta() != null ? #temporals.format(dados.ultimaConsulta(), 'dd/MM/yyyy') : '-'}">-</div>
            <div class="rotulo">❤️ Última consulta</div>
        </div>
    </section>

    <div class="atalhos">
        <a class="botao" th:href="@{/consultas}">📅 Agendar consulta</a>
        <a class="botao secundario" th:href="@{/vacinas}">💉 Registrar vacina</a>
        <a class="botao secundario" th:href="@{/pets}">🐾 Meus pets</a>
    </div>

    <div class="card">
        <h2>Próximas consultas agendadas</h2>
        <div class="tabela-scroll">
            <table>
                <thead><tr><th>Pet</th><th>Data/Hora</th><th>Motivo</th></tr></thead>
                <tbody>
                <tr th:each="c : ${dados.agendaProximosSete()}">
                    <td th:text="${c.petNome()}"></td>
                    <td th:text="${#temporals.format(c.dataHora(), 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${c.motivo()}"></td>
                </tr>
                <tr th:if="${dados.agendaProximosSete().isEmpty()}">
                    <td colspan="3" class="suave">Nenhuma consulta agendada.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
