<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Pets')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu('pets')}"></nav>

<main class="container">
    <h1>Meus Pets</h1>
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <div class="card">
        <h2>Cadastrar novo pet</h2>
        <form th:action="@{/pets}" method="post" class="grid-form">
            <div>
                <label for="nome">Nome do pet</label>
                <input id="nome" type="text" name="nome" required>
            </div>
            <div>
                <label for="raca">Raça</label>
                <input id="raca" type="text" name="raca" required>
            </div>
            <div>
                <label for="dataNascimento">Data de nascimento</label>
                <input id="dataNascimento" type="date" name="dataNascimento">
            </div>
            <div>
                <label for="peso">Peso (kg)</label>
                <input id="peso" type="number" step="0.1" min="0" name="peso">
            </div>
            <button type="submit">Cadastrar pet</button>
        </form>
    </div>

    <div class="card">
        <h2>Pets cadastrados</h2>
        <div class="tabela-scroll">
            <table>
                <thead><tr><th>Nome</th><th>Raça</th><th>Peso</th><th>Tutor</th><th>Ações</th></tr></thead>
                <tbody>
                <tr th:each="pet : ${pets}">
                    <td th:text="${pet.nome}"></td>
                    <td th:text="${pet.raca}"></td>
                    <td th:text="${pet.peso != null ? pet.peso + ' kg' : '-'}"></td>
                    <td th:text="${pet.tutor.nome}"></td>
                    <td class="acoes">
                        <a class="botao pequeno secundario" th:href="@{/vacinas(petId=${pet.id})}">Vacinas</a>
                        <form th:action="@{/pets/{id}/excluir(id=${pet.id})}" method="post"
                              onsubmit="return confirm('Excluir este pet e todo o histórico de consultas e vacinas dele?');">
                            <button type="submit" class="btn-excluir">Excluir</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pets.isEmpty()}">
                    <td colspan="5" class="suave">Nenhum pet cadastrado ainda. Cadastre o primeiro acima.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
