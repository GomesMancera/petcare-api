<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PetCareIA+ - Meus Pets</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="topo">
    <strong>🐾 PetCareIA+</strong>
    <div>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/pets}">Pets</a>
        <a th:href="@{/consultas}">Consultas</a>
        <a th:href="@{/vacinas}">Vacinas</a>
        <a th:href="@{/logout}">Sair</a>
    </div>
</div>

<div class="container">
    <h1>Meus Pets</h1>

    <div class="card">
        <h2>Cadastrar novo pet</h2>
        <form th:action="@{/pets}" method="post">
            <input type="text" name="nome" placeholder="Nome do pet" required>
            <input type="text" name="raca" placeholder="Raça" required>
            <input type="date" name="dataNascimento" placeholder="Data de nascimento">
            <input type="number" step="0.1" name="peso" placeholder="Peso (kg)">
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <div class="card">
        <h2>Pets cadastrados</h2>
        <table>
            <tr><th>Nome</th><th>Raça</th><th>Peso</th><th>Tutor</th><th></th></tr>
            <tr th:each="pet : ${pets}">
                <td th:text="${pet.nome}"></td>
                <td th:text="${pet.raca}"></td>
                <td th:text="${pet.peso}"></td>
                <td th:text="${pet.tutor.nome}"></td>
                <td>
                    <form th:action="@{/pets/{id}/excluir(id=${pet.id})}" method="post"
                          onsubmit="return confirm('Excluir este pet?');">
                        <button type="submit" class="btn-excluir">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pets.isEmpty()}">
                <td colspan="5">Nenhum pet cadastrado ainda.</td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
