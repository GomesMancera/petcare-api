<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Login')}"></head>
<body>
<main class="container card-central">
    <div class="card">
        <img class="logo-grande" th:src="@{/images/logo.png}" alt="Logo PetCareIA+">
        <p class="olho">PetCareIA+</p>
        <h1 class="centro">Bem-vindo de volta</h1>
        <p class="centro suave">A clínica e o tutor no mesmo lugar.</p>

        <p class="erro" role="alert" th:if="${param.error}">E-mail ou senha inválidos.</p>
        <p class="sucesso" th:if="${param.registrado}">Conta criada! Faça login.</p>
        <p class="sucesso" th:if="${param.logout}">Você saiu da sua conta.</p>

        <form th:action="@{/login}" method="post">
            <label for="username">E-mail</label>
            <input id="username" type="email" name="username" autocomplete="username" required>
            <label for="password">Senha</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
        </form>

        <p class="centro rodape-card">
            Não tem conta? <a th:href="@{/registrar}">Cadastre-se</a>
        </p>
    </div>
</main>
</body>
</html>
