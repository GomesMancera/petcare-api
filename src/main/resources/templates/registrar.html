<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Criar conta')}"></head>
<body>
<main class="container card-central">
    <div class="card">
        <h1 class="centro">🐾 Criar conta de Tutor</h1>

        <p class="erro" role="alert" th:if="${erro}" th:text="${erro}"></p>

        <form th:action="@{/registrar}" method="post">
            <label for="nome">Nome completo</label>
            <input id="nome" type="text" name="nome" th:value="${registroRequest != null} ? ${registroRequest.nome} : ''" required>
            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" th:value="${registroRequest != null} ? ${registroRequest.email} : ''" required>
            <label for="senha">Senha (mínimo 6 caracteres)</label>
            <input id="senha" type="password" name="senha" minlength="6" autocomplete="new-password" required>
            <button type="submit">Criar conta</button>
        </form>

        <p class="centro rodape-card">
            Já tem conta? <a th:href="@{/login}">Entrar</a>
        </p>
    </div>
</main>
</body>
</html>
