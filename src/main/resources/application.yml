# Nenhum segredo fica neste arquivo: tudo vem de variáveis de ambiente (ou do arquivo .env local, que NÃO vai pro Git).
# Veja o .env.example para a lista completa.
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # necessário atrás de proxy HTTPS (Render, Azure, etc.)

spring:
  application:
    name: petcare-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  mvc:
    format:
      date: iso
      time: iso
      date-time: iso

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}               # access token: 1 hora
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # refresh token: 7 dias

app:
  admin:
    nome: ${ADMIN_NOME:Administrador PetCare}
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
