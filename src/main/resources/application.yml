server:
  port: 8080

spring:
  application:
    name: petcare-api

  datasource:
    # Preencha com suas credenciais Oracle (NÃO commite senha real)
    url: jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl
    username: ${ORACLE_USER:SEU_USUARIO_ORACLE}
    password: ${ORACLE_PASSWORD:SUA_SENHA_ORACLE}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 60000
      idle-timeout: 10000
      max-lifetime: 30000
      initialization-fail-timeout: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  thymeleaf:
    cache: false

jwt:
  secret: ${JWT_SECRET:altere-esta-chave-secreta-para-uma-string-longa-e-aleatoria}
  expiration-ms: 86400000
